<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Document Explorer</title>
    <!-- Tailwind CSS Script CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

    <!-- MAIN PANEL: Full Page Chat Area -->
    <main class="flex-1 flex flex-col h-screen bg-gray-900">
        <!-- Top bar Header -->
        <header class="p-4 bg-gray-800 border-b border-gray-700">
            <h1 class="text-lg font-semibold text-white">💬 Document Query Chat</h1>
            <p class="text-xs text-gray-400">Ask questions directly below</p>
        </header>

        <!-- Chat Container Messages Box -->
        <div id="chatBox" class="flex-1 overflow-y-auto p-6 space-y-4">
            <!-- Welcome Bot Prompt Message -->
            <div class="flex items-start gap-3 max-w-2xl bg-gray-800 p-4 rounded-xl">
                <div class="bg-indigo-600 p-2 rounded-lg text-sm font-bold">AI</div>
                <div>
                    <p class="text-sm text-gray-200">Hi! I will answer questions purely from your context document. What would you like to know?</p>
                </div>
            </div>
        </div>

        <!-- Input Bar Box -->
        <div class="p-4 bg-gray-800 border-t border-gray-700">
            <div class="flex gap-3 max-w-4xl mx-auto">
                <input id="queryInput" type="text" placeholder="Ask something..." class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" onkeydown="if(event.key==='Enter') sendQuery()">
                <button onclick="sendQuery()" id="sendBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-3 rounded-xl transition duration-200">
                    Send
                </button>
            </div>
        </div>
    </main>

    <!-- CLIENT FRONTEND INTERACTION JAVASCRIPT -->
    <script>
        const API_URL = "http://127.0.0.1:8000";
        const chatBox = document.getElementById("chatBox");

        // Transmit chat prompt query and append layouts dynamically
        async function sendQuery() {
            const queryInput = document.getElementById("queryInput");
            const question = queryInput.value.trim();
            if(!question) return;

            // Render local user message balloon instantly
            appendMessage("user", question);
            queryInput.value = "";

            // Create placeholder loading bubble for assistant response
            const loadingId = appendMessage("assistant", `<span class="animate-pulse text-gray-400">Thinking...</span>`);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(`${API_URL}/query`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question: question })
                });
                
                const data = await response.json();
                
                // Build dynamic formatting highlighting retrieved source texts inside dropdown block
                let sourcesHtml = "";
                if(data.sources && data.sources.length > 0) {
                    sourcesHtml = `
                        <details class="mt-3 text-xs text-gray-400 cursor-pointer">
                            <summary class="hover:text-indigo-400 font-medium">View Retrieved Context Sources</summary>
                            <div class="mt-2 p-2 bg-gray-900 rounded border border-gray-700 font-mono text-[11px] whitespace-pre-wrap">${data.sources.join('\n\n--- Chunk ---\n\n')}</div>
                        </details>
                    `;
                }

                // Update assistant placeholder bubble with dynamic string data response
                const assistantMessageDiv = document.getElementById(loadingId);
                assistantMessageDiv.innerHTML = `<p class="text-sm text-gray-200">${data.answer}</p>${sourcesHtml}`;
                
            } catch (err) {
                console.error(err);
                const assistantMessageDiv = document.getElementById(loadingId);
                assistantMessageDiv.innerHTML = `<p class="text-sm text-red-400">Error fetching data response from API engine.</p>`;
            } finally {
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        // Helper function creating dynamic chat layouts
        function appendMessage(role, content) {
            const id = "msg-" + Math.random().toString(36).substr(2, 9);
            const isUser = role === "user";
            
            // Layout classes customized for alignment framework
            const alignmentClass = isUser ? 'ml-auto justify-end flex-row-reverse' : '';
            const bgClass = isUser ? 'bg-emerald-600' : 'bg-indigo-600';
            const cardClass = isUser ? 'bg-gray-800 p-3 rounded-xl text-gray-200' : 'text-gray-200';
            const wrapperClass = isUser ? '' : 'bg-gray-800 p-4 rounded-xl';

            const msgHtml = `
                <div class="flex items-start gap-3 max-w-2xl ${alignmentClass} ${wrapperClass}">
                    <div class="${bgClass} p-2 rounded-lg text-sm font-bold">${isUser ? 'YOU' : 'AI'}</div>
                    <div id="${id}">
                        <p class="text-sm ${cardClass}">${content}</p>
                    </div>
                </div>
            `;
            
            chatBox.insertAdjacentHTML("beforeend", msgHtml);
            return id;
        }
    </script>
</body>
</html>
